<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: local("Inter"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #12131c; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; color: #e9eaf2; }

  #hook {
    position: absolute; left: 0; top: 0; width: 1080px; height: 360px;
    display: flex; align-items: center; justify-content: center; padding: 60px 70px 30px;
    background: linear-gradient(180deg, #12131c 0%, #12131c 100%);
  }
  #hook .card {
    background: #ff8a3d; color: #1a1205; font-weight: 900; font-size: 58px; line-height: 1.12;
    text-align: center; padding: 26px 36px; border-radius: 28px; transform: rotate(-1.5deg);
    box-shadow: 0 10px 0 #b8541a;
  }

  #window {
    position: absolute; left: 30px; top: 380px; width: 1020px; height: 1170px;
    background: #1d1f2d; border-radius: 36px; overflow: hidden;
    display: flex; flex-direction: column; border: 3px solid #2a2d40;
  }
  #topbar {
    height: 110px; flex: none; display: flex; align-items: center; padding: 0 36px; gap: 18px;
    background: #191b27; border-bottom: 3px solid #2a2d40;
  }
  #topbar .hash { font-size: 54px; color: #7a7f9e; font-weight: 700; }
  #topbar .chan { font-size: 42px; font-weight: 800; }
  #topbar .srv { margin-left: auto; font-size: 30px; color: #8d92b3; font-weight: 600;
    background: #262939; padding: 10px 20px; border-radius: 40px; }

  #feed {
    flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 10px 0 18px;
  }
  .group { display: flex; gap: 24px; padding: 18px 36px 6px; }
  .group .av { width: 104px; height: 104px; flex: none; border-radius: 50%; position: relative; }
  .group .av svg { width: 104px; height: 104px; display: block; }
  .group .body { flex: 1; min-width: 0; }
  .group .head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 4px; }
  .group .name { font-size: 40px; font-weight: 800; }
  .group .tag { font-size: 24px; font-weight: 800; background: #ff8a3d; color: #1a1205;
    padding: 3px 12px; border-radius: 10px; position: relative; top: -4px; }
  .group .time { font-size: 26px; color: #6f7494; font-weight: 500; }
  .msg { font-size: 46px; line-height: 1.28; font-weight: 500; padding: 4px 0; word-wrap: break-word;
    transform-origin: left center; }
  .msg.big { font-size: 92px; font-weight: 900; line-height: 1.05; }
  .msg.deleted { color: #6f7494; font-style: italic; font-size: 38px; }
  .msg.edited::after { content: " (edited)"; font-size: 26px; color: #6f7494; }
  .reacts { display: flex; gap: 12px; margin: 6px 0 4px; }
  .react { background: #2b2f48; border: 3px solid #4c5280; border-radius: 22px; padding: 4px 16px;
    font-size: 34px; font-weight: 700; display: flex; gap: 10px; align-items: center; }

  .sys { display: flex; align-items: center; gap: 18px; padding: 16px 36px 16px 64px;
    font-size: 36px; color: #a3a8c9; font-weight: 600; }
  .sys .ico { font-size: 40px; }
  .sys.red { color: #ff6b6b; }
  .sys.gold { color: #ffcf3f; }

  #typing { height: 70px; flex: none; padding: 0 40px; font-size: 32px; color: #a3a8c9;
    display: flex; align-items: center; gap: 14px; font-weight: 600; }
  #typing .dots { display: flex; gap: 8px; }
  #typing .dots span { width: 14px; height: 14px; border-radius: 50%; background: #a3a8c9; opacity: .35; }
  #typing .dots span.on { opacity: 1; }

  #input { height: 120px; flex: none; margin: 0 28px 28px; background: #262939; border-radius: 26px;
    display: flex; align-items: center; padding: 0 34px; font-size: 38px; color: #6f7494; font-weight: 500; }

  #shake { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="shake">
  <div id="hook"><div class="card" id="hooktext"></div></div>
  <div id="window">
    <div id="topbar"><span class="hash">#</span><span class="chan" id="chan">general</span><span class="srv" id="srv"></span></div>
    <div id="feed"></div>
    <div id="typing"></div>
    <div id="input">Message #general</div>
  </div>
</div>
<div id="flash"></div>
<script>
const AV = {
  mochi: (c) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#ffd6e6"/>
    <ellipse cx="50" cy="58" rx="36" ry="30" fill="#fffaf5"/>
    <circle cx="38" cy="55" r="4.5" fill="#2b2230"/><circle cx="62" cy="55" r="4.5" fill="#2b2230"/>
    <ellipse cx="29" cy="64" rx="6" ry="3.5" fill="#ff9ec4"/><ellipse cx="71" cy="64" rx="6" ry="3.5" fill="#ff9ec4"/>
    <path d="M45 64 Q50 69 55 64" stroke="#2b2230" stroke-width="3" fill="none" stroke-linecap="round"/>${c}</svg>`,
  pickle: (c) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#d4f5cc"/>
    <ellipse cx="50" cy="62" rx="38" ry="28" fill="#5cbf4a"/>
    <circle cx="33" cy="38" r="13" fill="#5cbf4a"/><circle cx="67" cy="38" r="13" fill="#5cbf4a"/>
    <circle cx="33" cy="38" r="8" fill="#fff"/><circle cx="67" cy="38" r="8" fill="#fff"/>
    <rect x="28" y="36" width="10" height="4" rx="2" fill="#1e2a1b"/><rect x="62" y="36" width="10" height="4" rx="2" fill="#1e2a1b"/>
    <path d="M36 68 L64 68" stroke="#1e2a1b" stroke-width="3.5" stroke-linecap="round"/>${c}</svg>`,
  toast: (c) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#fbe7c4"/>
    <path d="M22 44 Q22 22 50 22 Q78 22 78 44 L76 82 Q76 86 72 86 L28 86 Q24 86 24 82 Z" fill="#c98a3e"/>
    <path d="M28 46 Q28 29 50 29 Q72 29 72 46 L70 78 Q70 80 68 80 L32 80 Q30 80 30 78 Z" fill="#f6d79b"/>
    <circle cx="41" cy="55" r="4" fill="#3a2614"/><circle cx="59" cy="55" r="4" fill="#3a2614"/>
    <path d="M35 46 L45 49 M65 46 L55 49" stroke="#3a2614" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M44 68 Q50 64 56 68" stroke="#3a2614" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="44" rx="2.5" ry="4" fill="#7cc6ff"/>${c}</svg>`,
  waffles: (c) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#fff0bf"/>
    <rect x="20" y="26" width="60" height="58" rx="12" fill="#e9a72c"/>
    <g stroke="#c98417" stroke-width="3"><path d="M35 28 V82 M50 28 V82 M65 28 V82 M22 41 H78 M22 55 H78 M22 69 H78"/></g>
    <circle cx="40" cy="52" r="5" fill="#2e1f08"/><circle cx="60" cy="52" r="5" fill="#2e1f08"/>
    <circle cx="41.5" cy="50.5" r="1.6" fill="#fff"/><circle cx="61.5" cy="50.5" r="1.6" fill="#fff"/>
    <path d="M42 66 Q50 73 58 66" stroke="#2e1f08" stroke-width="3.2" fill="none" stroke-linecap="round"/>${c}</svg>`,
};
const CROWN = `<path d="M30 20 L36 6 L44 15 L50 2 L56 15 L64 6 L70 20 Z" fill="#ffcf3f" stroke="#b8860b" stroke-width="2"/>`;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// state: {hook, server, chars:{id:{name,color,avatar,crown,tag}}, items:[...], typing:{names:[...],phase}, anim:{idx,p}, shake, flash}
window.render = function(st){
  document.getElementById('hooktext').innerHTML = esc(st.hook || '');
  document.getElementById('srv').textContent = st.server || '';
  const feed = document.getElementById('feed');
  let html = '';
  let lastWho = null;
  st.items.forEach((it, i) => {
    const animStyle = (st.anim && st.anim.idx === i) ? animCss(st.anim.p) : '';
    if (it.type === 'sys') {
      lastWho = null;
      html += `<div class="sys ${it.tone||''}" style="${animStyle}"><span class="ico">${it.icon||'➜'}</span><span>${esc(it.text)}</span></div>`;
      return;
    }
    const c = st.chars[it.who];
    const cls = ['msg']; if (it.big) cls.push('big'); if (it.deleted) cls.push('deleted'); if (it.edited) cls.push('edited');
    const text = it.deleted ? 'message deleted' : esc(it.text);
    const reacts = (it.reacts||[]).map(r => `<span class="react">${r.emoji}<span>${r.n}</span></span>`).join('');
    const line = `<div class="${cls.join(' ')}" style="${animStyle}">${text}</div>${reacts ? `<div class="reacts">${reacts}</div>`:''}`;
    if (lastWho === it.who && !it.newGroup) {
      html = html.replace(/<\/div><\/div><!--g-->$/, line + '</div></div><!--g-->');
    } else {
      const tag = c.tag ? `<span class="tag">${esc(c.tag)}</span>` : '';
      html += `<div class="group"><div class="av">${AV[c.avatar](c.crown ? CROWN : '')}</div><div class="body">
        <div class="head"><span class="name" style="color:${c.color}">${esc(c.name)}</span>${tag}<span class="time">${it.time||'Today at 3:14 AM'}</span></div>${line}</div></div><!--g-->`;
    }
    lastWho = it.who;
  });
  feed.innerHTML = html;

  const ty = document.getElementById('typing');
  if (st.typing && st.typing.names.length) {
    const ph = st.typing.phase % 3;
    const dots = [0,1,2].map(k => `<span class="${k===ph?'on':''}"></span>`).join('');
    const who = st.typing.names.map(n => `<b style="color:#e9eaf2">${esc(n)}</b>`).join(', ');
    ty.innerHTML = `<span class="dots">${dots}</span><span>${who} ${st.typing.names.length>1?'are':'is'} typing...</span>`;
  } else ty.innerHTML = '';

  const sh = st.shake || 0;
  document.getElementById('shake').style.transform = sh ? `translate(${(Math.sin(sh*13)*18).toFixed(1)}px, ${(Math.cos(sh*17)*14).toFixed(1)}px)` : '';
  document.getElementById('flash').style.opacity = st.flash || 0;
};
function animCss(p){
  // pop-in: scale + slide
  const e = 1 - Math.pow(1 - p, 3);
  const over = p < 1 ? Math.sin(p * Math.PI) * 0.04 : 0;
  return `transform: translateY(${((1-e)*40).toFixed(1)}px) scale(${(0.86 + 0.14*e + over).toFixed(3)}); opacity:${Math.min(1, p*2).toFixed(2)};`;
}
</script>
</body>
</html>
